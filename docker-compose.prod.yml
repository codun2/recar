# سيّار (recar) — production stack for recar.smartunita.com (/opt/recar)
# Project name pinned so it never clashes with other /opt/<x> stacks.
# Host nginx reverse-proxies recar.smartunita.com -> 127.0.0.1:8010 (recar-web).
name: recar

services:
  recar-db:
    image: mysql:8.0
    container_name: recar-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: recar
      MYSQL_USER: recar
      MYSQL_PASSWORD: Recar_pr0d_7nK3x
      MYSQL_ROOT_PASSWORD: Recar_root_9wT2v
    volumes:
      - recar-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pRecar_root_9wT2v"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [recar-net]

  recar-api:
    build: ./api
    container_name: recar-api
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://recar.smartunita.com
      DB_CONNECTION: mysql
      DB_HOST: recar-db
      DB_PORT: "3306"
      DB_DATABASE: recar
      DB_USERNAME: recar
      DB_PASSWORD: Recar_pr0d_7nK3x
      FILESYSTEM_DISK: public
    volumes:
      - ./api:/app
      - recar-api-storage:/app/storage/app/public
    depends_on:
      recar-db:
        condition: service_healthy
    networks: [recar-net]

  recar-web:
    image: nginx:alpine
    container_name: recar-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./.nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - recar-api
    networks: [recar-net]

volumes:
  recar-db-data:
  recar-api-storage:

networks:
  recar-net:
