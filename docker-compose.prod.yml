# Production stack for the Contabo VPS. One public entry = vet-web on
# 127.0.0.1:8007 (host nginx reverse-proxies a domain/port to it). The web
# container serves the static frontend AND proxies /api,/uploads → vet-api.
# DB and API are NOT published to the host (internal compose network only).
# Explicit project name so this stack never clashes with other /opt/*/repo
# projects (which would otherwise all default to the "repo" project name).
name: vet-clinic
services:
  vet-web:
    image: nginx:alpine
    container_name: vet-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8007:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./.nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [vet-api]
    networks: [vet-net]

  vet-db:
    image: mysql:8.0
    container_name: vet-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Vet_pr0d_7mK2pQ
      MYSQL_DATABASE: vet
    volumes:
      - vet-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pVet_pr0d_7mK2pQ"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [vet-net]

  vet-api:
    build: ./api
    container_name: vet-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./api:/app
    depends_on:
      vet-db:
        condition: service_healthy
    networks: [vet-net]

volumes:
  vet-db-data:

networks:
  vet-net:
