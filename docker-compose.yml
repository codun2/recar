# Layla Vet — full stack: static site (nginx) + Laravel API + MySQL
# One command runs everything: docker compose up -d
services:
  vet-web:
    image: nginx:alpine
    container_name: vet-clinic
    restart: unless-stopped
    ports:
      - "8087:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./.nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [vet-net]

  vet-db:
    image: mysql:8.0
    container_name: vet-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: vet
    ports:
      - "3399:3306"
    volumes:
      - vet-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [vet-net]

  vet-api:
    build: ./api
    container_name: vet-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./api:/app
    ports:
      - "8088:8000"
    depends_on:
      vet-db:
        condition: service_healthy
    networks: [vet-net]

volumes:
  vet-db-data:

networks:
  vet-net:
