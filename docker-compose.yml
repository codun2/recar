# سيّار (recar) — dev stack: static site (nginx) + Laravel API + MySQL
# One command: docker compose up -d
name: recar

services:
  recar-web:
    image: nginx:alpine
    container_name: recar-web
    restart: unless-stopped
    ports:
      - "8092:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./.nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - recar-api
    networks: [recar-net]

  recar-db:
    image: mysql:8.0
    container_name: recar-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: recar
      MYSQL_USER: recar
      MYSQL_PASSWORD: recar
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33010:3306"
    volumes:
      - recar-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [recar-net]

  recar-api:
    build: ./api
    container_name: recar-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./api:/app
    ports:
      - "8091:8000"
    depends_on:
      recar-db:
        condition: service_healthy
    networks: [recar-net]

volumes:
  recar-db-data:

networks:
  recar-net:
